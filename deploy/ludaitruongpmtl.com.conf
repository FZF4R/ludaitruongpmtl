# Nginx cho ludaitruongpmtl.com (FrontEnd, Next.js :3009) + api.ludaitruongpmtl.com (Backend, Sails :1337).
#
#   sudo cp deploy/ludaitruongpmtl.com.conf /etc/nginx/conf.d/ludaitruongpmtl.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ludaitruongpmtl.com -d www.ludaitruongpmtl.com -d api.ludaitruongpmtl.com
#
# certbot tự thêm "listen 443 ssl" + chứng chỉ vào từng server block. Cổng phải
# khớp PORT trong ecosystem.config.js (FrontEnd) và Backend/.env (Backend).

upstream LDT_BE {
    server 127.0.0.1:1337;
    keepalive 64;
}
upstream LDT_FE {
    server 127.0.0.1:3009;
    keepalive 64;
}

server {
    server_name ludaitruongpmtl.com www.ludaitruongpmtl.com;
    location / {
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host      $http_host;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass         http://LDT_FE;
        proxy_read_timeout 3600;

    }

    error_page  404              /404.html;
    location = /404.html {
        root   /home/shopclone24h.com/public_html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /home/shopclone24h.com/public_html;
    }
    # pass the PHP scripts to FastCGI server
    #
    location ~ \..*/.*\.php$ {
        return 403;
    }
}

server {
    server_name api.ludaitruongpmtl.com;
    client_max_body_size 8m;  # khớp giới hạn upload của Backend (config/http.js)
    location / {
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Host      $http_host;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_pass         http://LDT_BE;
        proxy_read_timeout 3600;

    }

    error_page  404              /404.html;
    location = /404.html {
        root   /home/shopclone24h.com/public_html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /home/shopclone24h.com/public_html;
    }
    # pass the PHP scripts to FastCGI server
    #
    location ~ \..*/.*\.php$ {
        return 403;
    }
}
