# Cấu hình Nginx cho ludaitruongpmtl.com (FrontEnd) + api.ludaitruongpmtl.com (Backend).
#
# FrontEnd và Backend là HAI domain khác nhau (đã trỏ sẵn trong Cloudflare
# DNS), nên API phải bật CORS cho đúng domain FrontEnd (xem FRONTEND_URL
# trong Backend/.env) - trình duyệt gọi thẳng sang api.ludaitruongpmtl.com
# (lib/auth.ts, lib/admin-api.ts) sẽ bị chặn nếu thiếu CORS.
#
# Cài đặt (CentOS 9 - xem thêm DEPLOY.md):
#   sudo cp deploy/ludaitruongpmtl.com.conf /etc/nginx/conf.d/ludaitruongpmtl.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ludaitruongpmtl.com -d www.ludaitruongpmtl.com -d api.ludaitruongpmtl.com
#
# Cloudflare: theo zone file đã xuất, có 5 bản ghi A cùng trỏ về một IP VPS
# và bật proxy (đám mây cam / cf_tags=cf-proxied:true) - ludaitruongpmtl.com,
# www (CNAME), api, cộng với bapi và watch. File này CHỈ cấu hình
# ludaitruongpmtl.com + www (FrontEnd) và api (Backend) - hai domain app
# hiện có. bapi/watch chưa có service nào chạy phía sau nên cố tình không
# thêm server block; Cloudflare vẫn trỏ được nhưng Nginx sẽ trả lỗi mặc định
# (không rơi vào 2 server block trên vì server_name không khớp) cho tới khi
# bạn cần dùng và thêm block riêng.
#
# Đặt SSL/TLS mode ở Cloudflare là "Full (strict)" sau khi certbot cấp xong
# chứng chỉ thật trên server - để "Flexible" thì trình duyệt <-> Cloudflare
# mã hoá nhưng Cloudflare <-> server lại không, dễ gây lặp chuyển hướng với
# các trang bắt buộc HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name ludaitruongpmtl.com www.ludaitruongpmtl.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.ludaitruongpmtl.com;

    client_max_body_size 8m;  # khớp giới hạn upload của Backend (config/http.js)

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# certbot --nginx sẽ tự thêm "listen 443 ssl" + đường dẫn chứng chỉ vào từng
# server block ở trên khi chạy lệnh cấp SSL - không cần tự viết phần đó.
